name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: market_brief

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market_brief/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/brief
      - name: Pytest
        run: pytest
        env:
          BRIEF_DATA_DIR: /tmp/brief-data
